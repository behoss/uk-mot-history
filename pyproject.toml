[project]
name = "uk-mot-history"
version = "0.1.0"
description = "Python client for the UK DVSA MOT History API: MOT tests, mileage, defects and clocking warnings by registration or VIN."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bez" }]
requires-python = ">=3.12"
dependencies = []
keywords = ["mot", "mot-history", "dvsa", "uk", "car-check", "vehicle-data", "mileage", "registration", "vin"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://behoss.github.io/uk-mot-history/"
Source = "https://github.com/behoss/uk-mot-history"
Issues = "https://github.com/behoss/uk-mot-history/issues"
"Free car check" = "https://getfreecarcheck.co.uk"

[project.scripts]
uk-mot-history = "uk_mot_history.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_mot_history"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
